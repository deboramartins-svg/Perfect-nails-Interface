<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Perfect Nails</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fff5f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #d4a5a9; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #f8d7da; border-radius: 10px; outline: none; }
        .btn { width: 100%; padding: 12px; background: #d4a5a9; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        p { font-size: 0.9rem; margin-top: 20px; color: #5a4a4b; }
        a { color: #d4a5a9; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Bem-vinda de volta!</h2>
        <input type="email" placeholder="Seu e-mail">
        <input type="password" placeholder="Sua senha">
        <button class="btn" onclick="alert('Login realizado (simulação)!')">ENTRAR</button>
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        <a href="index.html" style="display: block; margin-top: 15px; font-size: 0.8rem; color: #888;">← Voltar para o site</a>
    </div>
</body>
</html>
